<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10151d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="最後にいつやったかを、この端末だけに記録するシンプルなアプリ">
  <title>いつやった？</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2310151d'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%2367e8c7' stroke-width='6'/%3E%3Cpath d='M32 19v14l10 6' fill='none' stroke='%23f7b84b' stroke-linecap='round' stroke-width='6'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f15;
      --surface: #131a24;
      --surface-2: #1a2330;
      --line: #2a3544;
      --text: #f3f6fa;
      --muted: #99a7b8;
      --mint: #67e8c7;
      --mint-dark: #073e35;
      --amber: #f7b84b;
      --danger: #ff7b7b;
      --shadow: 0 18px 50px rgb(0 0 0 / 28%);
    }

    * { box-sizing: border-box; }

    html { background: var(--bg); }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 92% -4%, rgb(103 232 199 / 13%), transparent 30rem),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }

    button {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .shell {
      width: min(100%, 48rem);
      margin: 0 auto;
      padding: max(1.25rem, env(safe-area-inset-top)) 1rem max(2rem, env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.3rem;
    }

    .brand { display: flex; align-items: center; gap: .75rem; }

    .brand-mark {
      display: grid;
      width: 2.8rem;
      height: 2.8rem;
      place-items: center;
      border: 1px solid rgb(103 232 199 / 35%);
      border-radius: 1rem;
      background: var(--mint-dark);
      color: var(--mint);
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / 3%);
    }

    .brand-mark svg { width: 1.5rem; height: 1.5rem; }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 5vw, 1.8rem);
      letter-spacing: -.04em;
      line-height: 1.1;
    }

    .local-label {
      margin: .25rem 0 0;
      color: var(--muted);
      font-size: .78rem;
    }

    .status-pill {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: .35rem .6rem;
      color: var(--muted);
      font-size: .75rem;
    }

    .add-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: .65rem;
      padding: .65rem;
      border: 1px solid var(--line);
      border-radius: 1.1rem;
      background: rgb(19 26 36 / 88%);
      box-shadow: var(--shadow);
    }

    .add-form input, .dialog-input {
      min-width: 0;
      min-height: 3rem;
      border: 0;
      border-radius: .75rem;
      outline: none;
      background: var(--surface-2);
      color: var(--text);
      padding: 0 .9rem;
      font-size: 1rem;
    }

    .add-form input:focus, .dialog-input:focus {
      box-shadow: 0 0 0 2px var(--mint);
    }

    .primary-button {
      min-height: 3rem;
      border: 0;
      border-radius: .75rem;
      padding: 0 1rem;
      background: var(--mint);
      color: #062b25;
      font-weight: 800;
    }

    .primary-button:active { transform: translateY(1px); }

    .list-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      margin: 1.6rem .2rem .75rem;
    }

    .list-heading h2 {
      margin: 0;
      font-size: 1rem;
      letter-spacing: .03em;
    }

    .summary { margin: 0; color: var(--muted); font-size: .8rem; }

    .item-list {
      display: grid;
      gap: .75rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .item-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 1.15rem;
      background: linear-gradient(145deg, var(--surface), #101720);
      box-shadow: 0 10px 28px rgb(0 0 0 / 18%);
    }

    .item-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: .8rem;
      padding: 1rem;
    }

    .item-name {
      overflow-wrap: anywhere;
      margin: 0 0 .2rem;
      font-size: 1rem;
      font-weight: 750;
    }

    .elapsed {
      display: block;
      margin: 0;
      color: var(--amber);
      font-size: clamp(1.35rem, 7vw, 2rem);
      font-weight: 850;
      letter-spacing: -.04em;
      line-height: 1.15;
    }

    .last-date { margin: .25rem 0 0; color: var(--muted); font-size: .8rem; }

    .done-button {
      min-width: 5.7rem;
      min-height: 4.8rem;
      border: 1px solid rgb(103 232 199 / 45%);
      border-radius: 1rem;
      background: var(--mint-dark);
      color: var(--mint);
      font-weight: 850;
    }

    .done-button:active { background: #0b5145; transform: scale(.98); }

    .item-tools {
      display: flex;
      justify-content: flex-end;
      gap: .25rem;
      border-top: 1px solid rgb(42 53 68 / 75%);
      padding: .25rem .45rem;
    }

    .text-button {
      min-height: 2.65rem;
      border: 0;
      border-radius: .65rem;
      background: transparent;
      color: var(--muted);
      padding: 0 .65rem;
      font-size: .82rem;
    }

    .text-button:active { background: var(--surface-2); color: var(--text); }
    .text-button.danger { color: var(--danger); }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 1.15rem;
      padding: 2.5rem 1.25rem;
      text-align: center;
      color: var(--muted);
    }

    .empty strong { display: block; margin-bottom: .35rem; color: var(--text); font-size: 1.05rem; }

    .data-panel {
      margin-top: 1.4rem;
      border-top: 1px solid var(--line);
      padding-top: 1rem;
    }

    .data-panel summary {
      min-height: 2.75rem;
      cursor: pointer;
      color: var(--muted);
      font-size: .88rem;
      line-height: 2.75rem;
    }

    .data-actions { display: flex; flex-wrap: wrap; gap: .5rem; padding: .35rem 0; }

    .secondary-button {
      min-height: 2.75rem;
      border: 1px solid var(--line);
      border-radius: .7rem;
      background: var(--surface);
      color: var(--text);
      padding: 0 .8rem;
    }

    .footnote { margin: .7rem 0 0; color: var(--muted); font-size: .78rem; }

    dialog {
      width: min(calc(100% - 2rem), 28rem);
      border: 1px solid var(--line);
      border-radius: 1.15rem;
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow);
      padding: 1.1rem;
    }

    dialog::backdrop { background: rgb(0 0 0 / 65%); backdrop-filter: blur(3px); }
    dialog h2 { margin: 0 0 1rem; font-size: 1.15rem; }
    .dialog-field { display: grid; gap: .4rem; margin-top: .85rem; }
    .dialog-field:first-of-type { margin-top: 0; }
    .dialog-label { color: var(--muted); font-size: .82rem; font-weight: 700; }
    .dialog-input { width: 100%; }
    .dialog-help { margin: 0; color: var(--muted); font-size: .75rem; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: .5rem; margin-top: 1rem; }

    .toast {
      position: fixed;
      z-index: 10;
      right: 1rem;
      bottom: max(1rem, env(safe-area-inset-bottom));
      left: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      width: min(calc(100% - 2rem), 30rem);
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: .9rem;
      background: #202a37;
      box-shadow: var(--shadow);
      padding: .8rem 1rem;
      transform: translateY(150%);
      transition: transform .22s ease;
    }

    .toast.visible { transform: translateY(0); }
    .toast button { border: 0; background: transparent; color: var(--mint); font-weight: 800; }

    [hidden] { display: none !important; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (min-width: 42rem) {
      .shell { padding-inline: 1.5rem; }
      .item-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"></circle>
            <path d="M12 7v5l3.5 2" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path>
          </svg>
        </span>
        <div>
          <h1>いつやった？</h1>
          <p class="local-label">記録はこの端末だけに保存</p>
        </div>
      </div>
      <span class="status-pill" id="storageStatus">ローカル保存</span>
    </header>

    <main>
      <form class="add-form" id="addForm">
        <label class="sr-only" for="newItem">記録すること</label>
        <input id="newItem" name="name" maxlength="80" autocomplete="off" placeholder="記録したいこと" required>
        <button class="primary-button" type="submit">追加</button>
      </form>

      <div class="list-heading">
        <h2>古い順</h2>
        <p class="summary" id="summary">0件</p>
      </div>

      <div class="empty" id="emptyState">
        <strong>まだ項目がありません</strong>
        上の入力欄から、覚えておきたいことを追加してください。
      </div>
      <ul class="item-list" id="itemList" aria-live="polite"></ul>

      <details class="data-panel">
        <summary>バックアップと復元</summary>
        <div class="data-actions">
          <button class="secondary-button" id="exportButton" type="button">書き出す</button>
          <button class="secondary-button" id="importButton" type="button">読み込む</button>
          <input id="importFile" type="file" accept="application/json,.json,.txt" hidden>
        </div>
        <p class="footnote">機種変更やSafariのデータ削除に備えて、時々バックアップしてください。</p>
      </details>
    </main>
  </div>

  <dialog id="editDialog">
    <form id="editForm" method="dialog">
      <h2>項目を編集</h2>
      <div class="dialog-field">
        <label class="dialog-label" for="editName">名前</label>
        <input class="dialog-input" id="editName" maxlength="80" required>
      </div>
      <div class="dialog-field">
        <label class="dialog-label" for="editLastDone">最終日時</label>
        <input class="dialog-input" id="editLastDone" type="datetime-local">
        <p class="dialog-help">空欄で保存すると「まだ記録なし」に戻ります。</p>
      </div>
      <div class="dialog-actions">
        <button class="secondary-button" type="button" id="cancelEdit">キャンセル</button>
        <button class="primary-button" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toastMessage"></span>
    <button id="undoButton" type="button" hidden>元に戻す</button>
  </div>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "last-done-tracker:v1";
      const MAX_ITEMS = 1000;
      const state = { items: [], editingId: null, undo: null, toastTimer: null };

      const elements = {
        addForm: document.querySelector("#addForm"),
        newItem: document.querySelector("#newItem"),
        itemList: document.querySelector("#itemList"),
        emptyState: document.querySelector("#emptyState"),
        summary: document.querySelector("#summary"),
        storageStatus: document.querySelector("#storageStatus"),
        editDialog: document.querySelector("#editDialog"),
        editForm: document.querySelector("#editForm"),
        editName: document.querySelector("#editName"),
        editLastDone: document.querySelector("#editLastDone"),
        cancelEdit: document.querySelector("#cancelEdit"),
        exportButton: document.querySelector("#exportButton"),
        importButton: document.querySelector("#importButton"),
        importFile: document.querySelector("#importFile"),
        toast: document.querySelector("#toast"),
        toastMessage: document.querySelector("#toastMessage"),
        undoButton: document.querySelector("#undoButton")
      };

      function makeId() {
        return globalThis.crypto?.randomUUID?.() ?? `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function cleanName(value) {
        return String(value ?? "").trim().replace(/\s+/g, " ").slice(0, 80);
      }

      function load() {
        try {
          const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
          const candidates = Array.isArray(parsed) ? parsed : parsed?.items;
          if (!Array.isArray(candidates)) return;
          state.items = candidates.slice(0, MAX_ITEMS).map((item) => ({
            id: String(item.id || makeId()),
            name: cleanName(item.name),
            lastDone: item.lastDone && !Number.isNaN(Date.parse(item.lastDone)) ? new Date(item.lastDone).toISOString() : null,
            createdAt: item.createdAt && !Number.isNaN(Date.parse(item.createdAt)) ? new Date(item.createdAt).toISOString() : new Date().toISOString()
          })).filter((item) => item.name);
        } catch (error) {
          console.error("保存データを読み込めませんでした", error);
          elements.storageStatus.textContent = "読込エラー";
        }
      }

      function save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 1, items: state.items }));
      }

      function sortItems(items) {
        return [...items].sort((a, b) => {
          if (!a.lastDone && b.lastDone) return -1;
          if (a.lastDone && !b.lastDone) return 1;
          return Date.parse(a.lastDone || a.createdAt) - Date.parse(b.lastDone || b.createdAt);
        });
      }

      function elapsedText(iso) {
        if (!iso) return "まだ記録なし";
        const seconds = Math.max(0, Math.floor((Date.now() - Date.parse(iso)) / 1000));
        if (seconds < 60) return "たった今";
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return `${minutes}分前`;
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return `${hours}時間 ${minutes % 60}分前`;
        const days = Math.floor(hours / 24);
        return `${days}日 ${hours % 24}時間 ${minutes % 60}分前`;
      }

      const exactDate = new Intl.DateTimeFormat("ja-JP", {
        year: "numeric", month: "numeric", day: "numeric", weekday: "short",
        hour: "2-digit", minute: "2-digit"
      });

      function escapeHtml(value) {
        const node = document.createElement("span");
        node.textContent = value;
        return node.innerHTML;
      }

      function toLocalDateTimeValue(iso) {
        if (!iso) return "";
        const date = new Date(iso);
        const offset = date.getTimezoneOffset() * 60000;
        return new Date(date.getTime() - offset).toISOString().slice(0, 16);
      }

      function render() {
        const items = sortItems(state.items);
        elements.itemList.innerHTML = items.map((item) => `
          <li class="item-card" data-id="${escapeHtml(item.id)}">
            <div class="item-main">
              <div>
                <p class="item-name">${escapeHtml(item.name)}</p>
                <strong class="elapsed">${elapsedText(item.lastDone)}</strong>
                <p class="last-date">${item.lastDone ? `前回 ${exactDate.format(new Date(item.lastDone))}` : "「今やった」で最初の日時を記録"}</p>
              </div>
              <button class="done-button" type="button" data-action="done">今やった</button>
            </div>
            <div class="item-tools">
              <button class="text-button" type="button" data-action="edit">編集</button>
              <button class="text-button danger" type="button" data-action="delete">削除</button>
            </div>
          </li>
        `).join("");
        elements.emptyState.hidden = items.length > 0;
        elements.itemList.hidden = items.length === 0;
        elements.summary.textContent = `${items.length}件`;
      }

      function updateElapsedTimes() {
        elements.itemList.querySelectorAll(".item-card").forEach((card) => {
          const item = findItem(card.dataset.id);
          const elapsed = card.querySelector(".elapsed");
          if (item && elapsed) elapsed.textContent = elapsedText(item.lastDone);
        });
      }

      async function requestPersistence() {
        if (!navigator.storage?.persist) return;
        try {
          const persistent = await navigator.storage.persist();
          elements.storageStatus.textContent = persistent ? "永続保存" : "ローカル保存";
        } catch {
          elements.storageStatus.textContent = "ローカル保存";
        }
      }

      function showToast(message, undo) {
        clearTimeout(state.toastTimer);
        state.undo = undo || null;
        elements.toastMessage.textContent = message;
        elements.undoButton.hidden = !undo;
        elements.toast.classList.add("visible");
        state.toastTimer = setTimeout(() => {
          elements.toast.classList.remove("visible");
          state.undo = null;
        }, 5000);
      }

      function addItem(name) {
        const clean = cleanName(name);
        if (!clean) throw new Error("名前を入力してください");
        if (state.items.length >= MAX_ITEMS) throw new Error("項目数の上限に達しました");
        const item = { id: makeId(), name: clean, lastDone: null, createdAt: new Date().toISOString() };
        state.items.push(item);
        save();
        render();
        void requestPersistence();
        return item;
      }

      function findItem(id) {
        return state.items.find((item) => item.id === id);
      }

      function markDone(id, doneAt = new Date()) {
        const item = findItem(id);
        if (!item) throw new Error("項目が見つかりません");
        const previous = item.lastDone;
        item.lastDone = doneAt.toISOString();
        save();
        render();
        showToast(`${item.name}を記録しました`, () => {
          item.lastDone = previous;
          save();
          render();
        });
        void requestPersistence();
        return item;
      }

      elements.addForm.addEventListener("submit", (event) => {
        event.preventDefault();
        try {
          addItem(elements.newItem.value);
          elements.newItem.value = "";
          elements.newItem.focus();
        } catch (error) {
          showToast(error.message);
        }
      });

      elements.itemList.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-action]");
        const card = event.target.closest("[data-id]");
        if (!button || !card) return;
        const item = findItem(card.dataset.id);
        if (!item) return;
        if (button.dataset.action === "done") {
          markDone(item.id);
        } else if (button.dataset.action === "edit") {
          state.editingId = item.id;
          elements.editName.value = item.name;
          elements.editLastDone.value = toLocalDateTimeValue(item.lastDone);
          elements.editLastDone.max = toLocalDateTimeValue(new Date().toISOString());
          elements.editDialog.showModal();
          requestAnimationFrame(() => elements.editName.select());
        } else if (button.dataset.action === "delete" && confirm(`「${item.name}」を削除しますか？`)) {
          const index = state.items.findIndex((candidate) => candidate.id === item.id);
          state.items.splice(index, 1);
          save();
          render();
          showToast(`${item.name}を削除しました`, () => {
            state.items.splice(index, 0, item);
            save();
            render();
          });
        }
      });

      elements.editForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const item = findItem(state.editingId);
        const name = cleanName(elements.editName.value);
        if (!item || !name) return;
        const lastDone = elements.editLastDone.value
          ? new Date(elements.editLastDone.value)
          : null;
        if (lastDone && (Number.isNaN(lastDone.getTime()) || lastDone.getTime() > Date.now())) {
          showToast("最終日時は現在以前を指定してください");
          return;
        }
        item.name = name;
        item.lastDone = lastDone ? lastDone.toISOString() : null;
        save();
        render();
        elements.editDialog.close();
      });

      elements.cancelEdit.addEventListener("click", () => elements.editDialog.close());

      elements.undoButton.addEventListener("click", () => {
        const undo = state.undo;
        state.undo = null;
        elements.toast.classList.remove("visible");
        if (undo) undo();
      });

      elements.exportButton.addEventListener("click", () => {
        const body = JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), items: state.items }, null, 2);
        const blob = new Blob([body], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `last-done-backup-${new Date().toISOString().slice(0, 10)}.json`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });

      elements.importButton.addEventListener("click", () => elements.importFile.click());

      elements.importFile.addEventListener("change", async () => {
        const file = elements.importFile.files?.[0];
        elements.importFile.value = "";
        if (!file) return;
        try {
          const parsed = JSON.parse(await file.text());
          const candidates = Array.isArray(parsed) ? parsed : parsed?.items;
          if (!Array.isArray(candidates)) throw new Error("バックアップ形式ではありません");
          if (!confirm(`現在の記録を、読み込んだ${candidates.length}件で置き換えますか？`)) return;
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 1, items: candidates }));
          state.items = [];
          load();
          save();
          render();
          showToast("バックアップを読み込みました");
        } catch (error) {
          showToast(`読み込めませんでした: ${error.message}`);
        }
      });

      function registerWebMCP() {
        const context = document.modelContext;
        if (!context?.registerTool) return;
        const register = (tool) => {
          try { void Promise.resolve(context.registerTool(tool)).catch(console.error); }
          catch (error) { console.error(error); }
        };
        register({
          name: "list_last_done_items",
          title: "記録一覧を取得",
          description: "登録済みの項目と最後に行った日時を取得します。",
          inputSchema: { type: "object", properties: {}, additionalProperties: false },
          annotations: { readOnlyHint: true, untrustedContentHint: false },
          execute: () => ({ items: sortItems(state.items) })
        });
        register({
          name: "add_last_done_item",
          title: "記録項目を追加",
          description: "最後に行った日時を記録する新しい項目を追加します。",
          inputSchema: {
            type: "object",
            properties: { name: { type: "string", minLength: 1, maxLength: 80 } },
            required: ["name"],
            additionalProperties: false
          },
          annotations: { readOnlyHint: false, untrustedContentHint: false },
          execute: ({ name }) => ({ item: addItem(name) })
        });
        register({
          name: "mark_last_done_now",
          title: "今やったと記録",
          description: "指定した項目の最終実行日時を現在時刻に更新します。",
          inputSchema: {
            type: "object",
            properties: { id: { type: "string", minLength: 1 } },
            required: ["id"],
            additionalProperties: false
          },
          annotations: { readOnlyHint: false, untrustedContentHint: false },
          execute: ({ id }) => ({ item: markDone(id), status: "recorded" })
        });
      }

      load();
      render();
      registerWebMCP();
      setInterval(() => { if (!document.hidden) updateElapsedTimes(); }, 60000);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) updateElapsedTimes(); });
    })();
  </script>
</body>
</html>
